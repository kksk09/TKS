<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายงานจาก Notion Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f4; --surface: #ffffff; --surface-2: #f6f8f9;
    --text: #1f2d33; --muted: #6b7c85; --line: #e1e8eb;
    --accent: #2f7d79; --accent-soft: #dcefed; --accent-text: #1f5f5b;
    --head: #f0f4f5; --shadow: 0 1px 2px rgba(31,45,51,.05), 0 8px 24px rgba(31,45,51,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12191c; --surface: #1a2327; --surface-2: #202b30;
      --text: #e4ecef; --muted: #8fa1a9; --line: #2b383e;
      --accent: #5bb5af; --accent-soft: #23403f; --accent-text: #9fdcd7;
      --head: #202b30; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -.01em; }
  .subtitle { margin: 4px 0 24px; color: var(--muted); font-size: .95rem; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center;
    justify-content: space-between; margin-bottom: 16px;
  }
  .day-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    font: inherit; font-size: .92rem; cursor: pointer; color: var(--text);
    background: var(--surface); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 10px; transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .date-label { font-weight: 600; font-size: 1.05rem; padding: 0 6px; min-width: 190px; text-align: center; }
  input[type="date"] { font: inherit; font-size: .9rem; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); color-scheme: light dark; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: .85rem; color: var(--muted); }
  .stat strong { color: var(--text); font-size: 1.15rem; margin-right: 6px; font-weight: 600; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { padding: 12px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  thead th { background: var(--head); font-weight: 600; font-size: .9rem; white-space: nowrap; }
  thead tr.sort-row th { border-bottom: 0; padding-bottom: 6px; }
  thead tr.filter-row th { padding-top: 0; }
  .sort-btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .arrow { color: var(--muted); font-size: .75rem; opacity: .5; }
  th[aria-sort="ascending"] .arrow, th[aria-sort="descending"] .arrow { color: var(--accent); opacity: 1; }
  .filter-row input, .filter-row select {
    width: 100%; font: inherit; font-size: .85rem; font-weight: 400; padding: 6px 10px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }
  .note { max-width: 340px; color: var(--muted); }
  .title { font-weight: 500; }
  .nowrap { white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--accent-soft); color: var(--accent-text); padding: 2px 10px; border-radius: 999px; font-size: .82rem; }
  a { color: var(--accent); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  .msg { text-align: center; padding: 56px 20px; color: var(--muted); }
  .msg.error { color: #d1495b; }
  .count { padding: 10px 16px; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); background: var(--head); }
  @media (max-width: 600px) { .wrap { padding: 20px 12px 32px; } .date-label { min-width: 0; width: 100%; order: -1; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>รายงานจาก Notion Calendar</h1>
  <p class="subtitle">ข้อมูลล่าสุดจากฐานข้อมูล Notion</p>

  <div class="toolbar">
    <div class="day-nav">
      <button class="btn" id="prev" aria-label="วันก่อนหน้า">‹ วันก่อนหน้า</button>
      <button class="btn primary" id="today">วันนี้</button>
      <button class="btn" id="next" aria-label="วันถัดไป">วันถัดไป ›</button>
      <span class="date-label" id="dateLabel" aria-live="polite"></span>
      <input type="date" id="datePick" aria-label="เลือกวันที่">
      <button class="btn" id="all" aria-pressed="false">ดูทั้งหมด</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <div class="scroll" id="content"><div class="msg">กำลังโหลดข้อมูล...</div></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const toKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayKey = v => {
    if (!v) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;   // วันที่ล้วน ไม่แปลง timezone
    const d = new Date(v);
    return isNaN(d) ? '' : toKey(d);
  };
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtLong = k => parseKey(k).toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const fmtShort = k => k ? parseKey(k).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }) : '-';

  const state = {
    data: [], day: toKey(new Date()), showAll: false,
    sortKey: 'date', sortDir: 'asc',
    filters: { title: '', note: '', employee: '' }
  };

  const columns = [
    { key: 'title', label: 'ชื่อ' },
    { key: 'date', label: 'วันที่' },
    { key: 'note', label: 'NOTE' },
    { key: 'employee', label: 'Employee' } 
  ];

  const empList = i => (i.employees && i.employees.length) ? i.employees : (i.employeesText ? [i.employeesText] : []);
  const cellValue = (i, k) => {
    if (k === 'date') return dayKey(i.date);
    if (k === 'employee') return empList(i).join(', ');
    return String(i[k] ?? '');
  };

  function shiftDay(n) {
    const d = parseKey(state.day); d.setDate(d.getDate() + n);
    setDay(toKey(d));
  }
  function setDay(k) { state.day = k; state.showAll = false; renderAll(); }

  function visibleRows() {
    const f = state.filters;
    const has = (v, q) => v.toLowerCase().includes(q.trim().toLowerCase());
    let rows = state.data.filter(i => {
      if (!state.showAll && dayKey(i.date) !== state.day) return false;
      if (f.title && !has(cellValue(i, 'title'), f.title)) return false;
      if (f.note && !has(cellValue(i, 'note'), f.note)) return false;
      if (f.employee && !empList(i).includes(f.employee)) return false;
      return true;
    });
    const { sortKey: k, sortDir: dir } = state;
    rows.sort((a, b) => cellValue(a, k).localeCompare(cellValue(b, k), 'th', { numeric: true }) * (dir === 'asc' ? 1 : -1));
    return rows;
  }

  function renderToolbar() {
    $('dateLabel').textContent = state.showAll ? 'ทุกวัน' : fmtLong(state.day);
    $('datePick').value = state.day;
    $('all').setAttribute('aria-pressed', state.showAll);
    ['prev', 'next'].forEach(id => $(id).disabled = state.showAll);
    const now = new Date(), monthCount = state.data.filter(d => {
      const k = dayKey(d.date); return k && parseKey(k).getMonth() === now.getMonth() && parseKey(k).getFullYear() === now.getFullYear();
    }).length;
    const dayCount = state.data.filter(d => dayKey(d.date) === state.day).length;
    $('stats').innerHTML = `
      <div class="stat"><strong>${dayCount}</strong>วันที่เลือก</div>
      <div class="stat"><strong>${monthCount}</strong>เดือนนี้</div>
      <div class="stat"><strong>${state.data.length}</strong>ทั้งหมด</div>`;
  }

  function renderBody() {
    const rows = visibleRows();
    $('tbody').innerHTML = rows.length ? rows.map(i => {
      const emps = empList(i);
      return `<tr>
        <td class="title">${esc(i.title || 'ไม่มีชื่อ')}</td>
        <td class="nowrap">${fmtShort(dayKey(i.date))}</td>
        <td class="note">${esc(i.note) || '-'}</td>
        <td>${emps.length ? `<div class="tags">${emps.map(n => `<span class="tag">${esc(n)}</span>`).join('')}</div>` : '-'}</td>

        

      </tr>`;
    }).join('') : `<tr><td colspan="5"><div class="msg">${state.showAll ? 'ไม่พบข้อมูลที่ตรงกับตัวกรอง' : 'ไม่มีรายการในวันนี้ ลองเปลี่ยนวันที่ หรือกด “ดูทั้งหมด”'}</div></td></tr>`;
    $('count').textContent = `แสดง ${rows.length} จาก ${state.data.length} รายการ`;
  }

  function buildTable() {
    const employees = [...new Set(state.data.flatMap(empList))].sort((a, b) => a.localeCompare(b, 'th'));
    $('content').innerHTML = `
      <table>
        <thead>
          <tr class="sort-row">${columns.map(c => c.nosort ? `<th>${c.label}</th>` :
            `<th data-key="${c.key}" aria-sort="none"><button class="sort-btn" type="button">${c.label}<span class="arrow">↕</span></button></th>`).join('')}</tr>
          <tr class="filter-row">
            <th><input type="search" data-f="title" placeholder="ค้นหาชื่อ" aria-label="ค้นหาชื่อ"></th>
            <th></th>
            <th><input type="search" data-f="note" placeholder="ค้นหา NOTE" aria-label="ค้นหา NOTE"></th>
            <th><select data-f="employee" aria-label="กรอง Employee"><option value="">ทั้งหมด</option>${employees.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="count" id="count"></div>`;

    document.querySelectorAll('.sort-row th[data-key]').forEach(th => {
      th.querySelector('button').addEventListener('click', () => {
        const k = th.dataset.key;
        state.sortDir = (state.sortKey === k && state.sortDir === 'asc') ? 'desc' : 'asc';
        state.sortKey = k;
        renderSortIcons(); renderBody();
      });
    });
    document.querySelectorAll('[data-f]').forEach(el => {
      el.addEventListener('input', () => { state.filters[el.dataset.f] = el.value; renderBody(); });
    });
    renderSortIcons();
  }

  function renderSortIcons() {
    document.querySelectorAll('.sort-row th[data-key]').forEach(th => {
      const active = th.dataset.key === state.sortKey;
      th.setAttribute('aria-sort', active ? (state.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
      th.querySelector('.arrow').textContent = active ? (state.sortDir === 'asc' ? '▲' : '▼') : '↕';
    });
  }

  function renderAll() { renderToolbar(); renderBody(); }

  $('prev').onclick = () => shiftDay(-1);
  $('next').onclick = () => shiftDay(1);
  $('today').onclick = () => setDay(toKey(new Date()));
  $('datePick').onchange = e => e.target.value && setDay(e.target.value);
  $('all').onclick = () => { state.showAll = !state.showAll; renderAll(); };

  fetch('data.json')
    .then(res => { if (!res.ok) throw new Error('ไม่พบไฟล์ data.json'); return res.json(); })
    .then(data => { state.data = data; buildTable(); renderAll(); })
    .catch(err => { $('content').innerHTML = `<div class="msg error">โหลดข้อมูลไม่สำเร็จ: ${esc(err.message)}</div>`; renderToolbar(); });
</script>
</body>
</html>
